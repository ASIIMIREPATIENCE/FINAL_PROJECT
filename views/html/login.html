<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyondoStock - Login</title>
    
    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="c/css/login.css">
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        <img src="/images/logo.png" alt="NyondoStock Logo">
        <h2>NyondoStock</h2>
        <p>Hardware Management System</p>
        
        <!-- Security Badge -->
        <div class="security-badge">
            <i class="bi bi-shield-lock-fill"></i>
            <span>SECURE ACCESS</span>
        </div>
        
        <!-- Login Form -->
        <form action="postlogin" method="post">
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold" style="color: #0D3B2E;">Email </label>
                <input type="text" class="form-control" placeholder="Enter your email" name="email">
            </div>
            
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold" style="color: #0D3B2E;">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" name="password">
                <div class="text-end mt-1">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i> SIGN IN
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
