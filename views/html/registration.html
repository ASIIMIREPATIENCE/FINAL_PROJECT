<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyondoStock - Register</title>
    
    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/registration.css">
</head>
<body>

    <div class="register-card">
        <!-- Logo -->
        <img src="/images/logo.png" alt="NyondoStock Logo">
        <h2>Create Account</h2>
        <p>Register to access NyondoStock</p>
        
        <!-- Security Badge -->
        <div class="security-badge">
            <i class="bi bi-shield-lock-fill"></i>
            <span>SECURE REGISTRATION</span>
        </div>
        
        <!-- Registration Form -->
        <form action="/registration" method="post">
            <!-- Full Name -->
            <div class="mb-3 text-start">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your full name" name="fullname">
            </div>
            
            <!-- Email -->
            <div class="mb-3 text-start">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email" name="email">
            </div>
            
            <!-- Phone Number -->
            <div class="mb-3 text-start">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" placeholder="e.g., 07XX XXX XXX" name="phonenumber">
            </div>
            
            <!-- Password -->
            <div class="mb-3 text-start">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Create a password" name="password">
            </div>
            
            <!-- Confirm Password -->
            <div class="mb-3 text-start">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm your password" name="password">
            </div>
            
            <!-- Role Selection -->
            <div class="mb-3 text-start">
                <label class="form-label">Select Role</label>
                <select class="form-select" name="role">
                    <option selected disabled>Select your role</option>
                    <option value="admin">Administrator</option>
                    <option value="store_manager">Store Manager</option>
                    <option value="sales_attendant">Sales Attendant</option>
                </select>
            </div>
            
            <!-- Register Button -->
            <button type="submit" class="btn-register">
                <i class="bi bi-person-plus me-2"></i> REGISTER
            </button>
            
            <!-- Login Link -->
            <div class="login-link">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
